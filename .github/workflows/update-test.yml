name: Update test

# Real-Windows check of the in-app updater: installs old releases, opens the app, clicks
# Settings › Check for updates › Download › Restart and update like a person would, then
# records how long the app is gone, what is installed, and a screenshot of the desktop.
on:
  workflow_dispatch:
    inputs:
      install:
        description: Releases to install first, in order (space separated tags, or "source" for a build of this commit)
        required: true
        default: v1.1.0
      scenario:
        description: normal | allusers (installed for everyone) | reopen (user opens the app again mid-install) | noinstaller (installer never runs; the relaunch guard must bring the app back)
        required: true
        default: normal

jobs:
  update:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($tag in "${{ inputs.install }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            if ($tag -eq 'source') {
              npm ci | Out-Null
              npm run dist | Out-Null
              New-Item -ItemType Directory "old\$tag" -Force | Out-Null
              Copy-Item dist\RemindAni-Setup-*.exe "old\$tag\"
            } else {
              gh release download $tag --pattern "RemindAni-Setup-*.exe" --dir "old\$tag"
            }
            $setup = Get-ChildItem "old\$tag\*.exe" | Select-Object -First 1
            $installArgs = if ('${{ inputs.scenario }}' -eq 'allusers') { '/S /allusers' } else { '/S' }
            Start-Process $setup.FullName -ArgumentList $installArgs -Wait
            Get-Process RemindAni -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $exe = @("$env:LOCALAPPDATA\Programs\RemindAni\RemindAni.exe", "$env:ProgramFiles\RemindAni\RemindAni.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            "Installed $tag -> $exe $((Get-Item $exe).VersionInfo.ProductVersion)"
            Set-Content exe-path.txt $exe
          }

      - name: Guard smoke test (start four ways, parent exits at once)
        run: node .github/scripts/guard-smoke.cjs

      - name: Guard smoke results
        run: |
          Start-Sleep 20
          foreach ($n in 'A', 'B', 'C', 'D') {
            "variant $n log: $((Get-Content "$env:TEMP\guard-$n.log" -ErrorAction SilentlyContinue) -join ' | ')"
            "variant $n reopened its target: $([bool](Get-Process "note$n" -ErrorAction SilentlyContinue))"
          }
          Get-Process noteA, noteB, noteC, noteD -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Click through the update like a user
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.64.0 | Out-Null
          $env:REMINDANI_EXE = Get-Content exe-path.txt
          $env:SCENARIO = '${{ inputs.scenario }}'
          node .github/scripts/click-update.mjs

      - name: Wait for the app to come back
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          New-Item -ItemType Directory shots | Out-Null
          $clicked = [datetime]::Parse((Get-Content clicked-at.txt))
          $back = $null
          foreach ($i in 1..120) {
            $p = Get-Process RemindAni -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'RemindAni'
            if ($p) { $back = Get-Date; break }
            if ($i -in 1, 6) {
              "powershell processes at +$i s:"
              Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | ForEach-Object { "  $($_.ProcessId) parent $($_.ParentProcessId) $($_.CommandLine.Substring(0, [Math]::Min(120, $_.CommandLine.Length)))" }
            }
            if ($i -in 5, 15, 30) { Shot "during-$i" }
            Start-Sleep 1
          }
          if ($back) { "App window back after $([int]($back - $clicked).TotalSeconds) s" } else { "App window NOT back after 120 s" }
          Start-Sleep 4
          Shot 'after'
          $exe = Get-Content exe-path.txt
          "Installed exe version: $((Get-Item $exe -ErrorAction SilentlyContinue).VersionInfo.ProductVersion)"
          "Files in install folder: $((Get-ChildItem (Split-Path $exe) -ErrorAction SilentlyContinue).Count)"
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -like 'RemindAni*' | Select-Object DisplayName, DisplayVersion, PSPath | Format-List
          Get-Process RemindAni -ErrorAction SilentlyContinue | Select-Object Id, StartTime, MainWindowTitle | Format-Table -AutoSize
          "Updater log:"
          Get-Content "$env:APPDATA\RemindAni\logs\updater.log" -ErrorAction SilentlyContinue
          if (-not $back) { exit 1 }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screens
          path: shots
