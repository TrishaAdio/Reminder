name: Release

# Push a tag like v1.2.0 and this builds the installer on Windows and publishes it, with
# latest.yml and the .blockmap, to the GitHub Release that installed copies update from.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Skip if npm run release already published this tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already has latest.yml; nothing to do."
          fi

      - if: steps.existing.outputs.done != 'true'
        run: npm ci

      - if: steps.existing.outputs.done != 'true'
        run: npm test

      # The tag is the version: v1.2.0 builds 1.2.0 even if package.json was not bumped.
      - if: steps.existing.outputs.done != 'true'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - if: steps.existing.outputs.done != 'true'
        run: npm run publish
        env:
          GH_TOKEN: ${{ github.token }}

      # electron-builder can exit 0 without uploading; fail loudly if the updater files are missing.
      - name: Check the release has everything updates need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          for f in latest.yml "RemindAni-Setup-${GITHUB_REF_NAME#v}.exe" "RemindAni-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"; do
            grep -qxF "$f" <<< "$assets" || { echo "::error::$f is missing from the release"; exit 1; }
          done
