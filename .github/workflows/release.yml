name: Release installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never

      - name: Attach installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          exe=$(ls RemindAni-Setup-*.exe)
          sha256sum "$exe" > "$exe.sha256"
          cat "$exe.sha256"
          gh release upload "$TAG" "$exe" "$exe.sha256" --clobber
