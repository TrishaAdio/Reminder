name: Defender scan

# Installs a release and asks Microsoft Defender to scan every installed file, to tell whether
# antivirus is what removes RemindAni.exe on some PCs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to scan
        required: true
        default: v1.2.0

jobs:
  scan:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "RemindAni-Setup-*.exe" --dir setup
          $setup = Get-ChildItem setup\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          Get-Process RemindAni -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Scan with Defender
        run: |
          $s = Get-MpComputerStatus
          "Defender engine $($s.AMEngineVersion), signatures $($s.AntivirusSignatureVersion) ($($s.AntivirusSignatureLastUpdated))"
          Update-MpSignature -ErrorAction SilentlyContinue
          $mp = Get-ChildItem "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          foreach ($target in (Get-ChildItem setup\*.exe).FullName, "$env:LOCALAPPDATA\Programs\RemindAni") {
            "== $target"
            & $mp.FullName -Scan -ScanType 3 -File $target -DisableRemediation | Select-String -Pattern 'found|Threat|scanning' | ForEach-Object { "  $_" }
          }
          "Detections:"
          Get-MpThreatDetection | Select-Object ThreatID, InitialDetectionTime, Resources | Format-List
          "Install folder still has RemindAni.exe: $(Test-Path "$env:LOCALAPPDATA\Programs\RemindAni\RemindAni.exe")"
